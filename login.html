<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Placement Portal Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f9d58,#34a853);
}

.container{
    width:900px;
    display:flex;
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.left{
    width:50%;
    background:linear-gradient(135deg,#0f9d58,#34a853);
    color:white;
    padding:50px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.left h1{
    font-size:40px;
    margin-bottom:20px;
}

.left p{
    line-height:1.8;
}

.right{
    width:50%;
    padding:50px;
}

.right h2{
    text-align:center;
    margin-bottom:30px;
    color:#0f9d58;
}

.input-group{
    margin-bottom:20px;
}

.input-group label{
    display:block;
    margin-bottom:5px;
}

.input-group input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
}

button{
    width:100%;
    padding:12px;
    background:#0f9d58;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#0b7c45;
}

.register{
    text-align:center;
    margin-top:20px;
}

.register a{
    color:#0f9d58;
    text-decoration:none;
}

@media(max-width:768px){
    .container{
        width:95%;
        flex-direction:column;
    }

    .left,.right{
        width:100%;
    }
}
</style>
</head>
<body>

<div class="container">

    <div class="left">
        <h1>Training & Placement Portal</h1>
        <p>
            Connect students with top recruiters,
            manage placement drives, and track
            career opportunities in one platform.
        </p>
    </div>

    <div class="right">

        <h2>Student Login</h2>

        <form id="loginForm">

            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>

            <button type="submit">Login</button>

        </form>

        <div class="register">
            Don't have an account?
            <a href="register.html">Register</a>
        </div>

    </div>

</div>

<script>
document.getElementById("loginForm").addEventListener("submit",function(e){

    e.preventDefault();

    let email=document.getElementById("email").value;
    let password=document.getElementById("password").value;

    if(email==="" || password===""){
        alert("Please fill all fields");
        return;
    }

    alert("Login Successful!");
});
</script>

</body>
</html>
